[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "livro-platform-ledger"
version = "0.1.0"
description = "Structural validation for Livro's cross-tenant billing/provisioning records (multi-tenant expansion)"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["platform_ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
