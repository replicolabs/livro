[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "livro-trust"
version = "0.1.0"
description = "Pure, independently-testable fund-moving-instruction trust guard for Livro (CLAUDE.md Section 1.4)"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["trust"]

[tool.pytest.ini_options]
testpaths = ["tests"]
