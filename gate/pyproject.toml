[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "livro-gate"
version = "0.1.0"
description = "Multi-tenant routing/billing gate sitting between Meta's WhatsApp Cloud API and ZeroClaw"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "tomlkit>=0.13",
    "base58>=2.1",
]

[tool.setuptools]
packages = ["gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
