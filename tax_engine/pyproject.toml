[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "livro-tax-engine"
version = "0.1.0"
description = "Pure, independently-testable Brazilian tax arithmetic for Livro"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["tax_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
